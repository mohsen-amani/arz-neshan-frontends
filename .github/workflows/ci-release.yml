name: CI and release

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: frontends-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: regi.mohsenamani.com
  REGISTRY_NAMESPACE: arz-neshan-infra
  INFRA_REPOSITORY: mohsen-amani/arz-neshan-infra

jobs:
  verify:
    name: Verify frontend workspace
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.1

      - name: Enable Corepack
        run: corepack enable

      - name: Install locked dependencies
        run: yarn install --immutable

      - name: Test all frontend applications
        run: yarn test

      - name: Build all frontend applications
        run: yarn build

  containers:
    name: Build ${{ matrix.image }} image
    needs: verify
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: web
            dockerfile: deploy/web/Dockerfile
          - image: platform
            dockerfile: deploy/platform/Dockerfile
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      - name: Select and validate Turnstile site key
        id: turnstile
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
        run: |
          set -euo pipefail
          key="$TURNSTILE_SITE_KEY"
          if [[ "$EVENT_NAME" == "push" && -z "$key" ]]; then
            echo "::error::TURNSTILE_SITE_KEY repository variable is required for a release."
            exit 1
          fi
          if [[ -z "$key" ]]; then
            key=test-site-key
          fi
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Log in to private registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and optionally publish immutable image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: |
            TURNSTILE_SITE_KEY=${{ steps.turnstile.outputs.key }}
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/${{ matrix.image }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=frontends-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=frontends-${{ matrix.image }}
          provenance: mode=max
          sbom: true

  promote:
    name: Promote frontend release
    if: github.event_name == 'push'
    needs: containers
    runs-on: ubuntu-24.04
    steps:
      - name: Verify published manifests
        shell: bash
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$REGISTRY_PASSWORD" | docker login "$REGISTRY" --username "$REGISTRY_USERNAME" --password-stdin
          for image in web platform; do
            docker buildx imagetools inspect "$REGISTRY/$REGISTRY_NAMESPACE/$image:sha-$GITHUB_SHA" >/dev/null
          done

      - name: Dispatch immutable release to infrastructure
        shell: bash
        env:
          INFRA_TOKEN: ${{ secrets.INFRA_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          : "${INFRA_TOKEN:?INFRA_DISPATCH_TOKEN is required}"
          payload="$(jq -n \
            --arg service frontends \
            --arg source_repository "$GITHUB_REPOSITORY" \
            --arg source_sha "$GITHUB_SHA" \
            --arg source_run_number "$GITHUB_RUN_NUMBER" \
            --arg tag "sha-$GITHUB_SHA" \
            '{event_type:"image_published",client_payload:{service:$service,source_repository:$source_repository,source_sha:$source_sha,source_run_number:$source_run_number,tag:$tag,migrations_changed:false}}')"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${INFRA_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "$payload" \
            "https://api.github.com/repos/${INFRA_REPOSITORY}/dispatches"
