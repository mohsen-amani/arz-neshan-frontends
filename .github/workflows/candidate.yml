name: Candidate

on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  REGISTRY: regi.mohsenamani.com
  REGISTRY_NAMESPACE: arz-neshan
  INFRA_REPOSITORY: mohsen-amani/arz-neshan-infra

jobs:
  ci:
    name: Required CI
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ github.sha }}
    permissions:
      contents: read

  publish:
    name: Publish frontend candidates
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    concurrency:
      group: arz-neshan-frontends-production-candidate
      cancel-in-progress: false

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Validate publication configuration
        shell: bash
        env:
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
          INFRA_TOKEN: ${{ secrets.INFRA_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          : "${TURNSTILE_SITE_KEY:?TURNSTILE_SITE_KEY repository variable is required}"
          : "${REGISTRY_USERNAME:?REGISTRY_USERNAME is required}"
          : "${REGISTRY_PASSWORD:?REGISTRY_PASSWORD is required}"
          : "${INFRA_TOKEN:?INFRA_DISPATCH_TOKEN is required}"

          if [[ "$TURNSTILE_SITE_KEY" == "1x00000000000000000000AA" ||
                "$TURNSTILE_SITE_KEY" == "test-site-key" ]]; then
            echo "::error::Production candidates must use the real Cloudflare Turnstile sitekey."
            exit 1
          fi

      - name: Log in to registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push immutable web candidate
        id: web
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/web/Dockerfile
          build-args: |
            TURNSTILE_SITE_KEY=${{ vars.TURNSTILE_SITE_KEY }}
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/web:sha-${{ github.sha }}
          cache-from: type=gha,scope=frontends-web
          cache-to: type=gha,mode=max,scope=frontends-web
          provenance: mode=max
          sbom: true

      - name: Build and push immutable platform candidate
        id: platform
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/platform/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/platform:sha-${{ github.sha }}
          cache-from: type=gha,scope=frontends-platform
          cache-to: type=gha,mode=max,scope=frontends-platform
          provenance: mode=max
          sbom: true

      - name: Verify published candidates
        shell: bash
        env:
          WEB_IMAGE: ${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/web
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
          PLATFORM_IMAGE: ${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/platform
          PLATFORM_DIGEST: ${{ steps.platform.outputs.digest }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          : "${WEB_DIGEST:?Web build did not return an image digest}"
          : "${PLATFORM_DIGEST:?Platform build did not return an image digest}"

          docker buildx imagetools inspect "${WEB_IMAGE}@${WEB_DIGEST}"
          docker buildx imagetools inspect "${WEB_IMAGE}:sha-${SOURCE_SHA}"
          docker buildx imagetools inspect "${PLATFORM_IMAGE}@${PLATFORM_DIGEST}"
          docker buildx imagetools inspect "${PLATFORM_IMAGE}:sha-${SOURCE_SHA}"

      - name: Dispatch immutable release to infrastructure
        shell: bash
        env:
          INFRA_TOKEN: ${{ secrets.INFRA_DISPATCH_TOKEN }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
          PLATFORM_DIGEST: ${{ steps.platform.outputs.digest }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          jq -n \
            --arg event_type image_published \
            --arg service frontends \
            --arg source_repository "$GITHUB_REPOSITORY" \
            --arg source_sha "$SOURCE_SHA" \
            --arg tag "sha-${SOURCE_SHA}" \
            --arg web_digest "$WEB_DIGEST" \
            --arg platform_digest "$PLATFORM_DIGEST" \
            --argjson source_run_number "$GITHUB_RUN_NUMBER" \
            '{
              event_type: $event_type,
              client_payload: {
                service: $service,
                source_repository: $source_repository,
                source_sha: $source_sha,
                source_run_number: $source_run_number,
                tag: $tag,
                migrations_changed: false,
                web_digest: $web_digest,
                platform_digest: $platform_digest
              }
            }' > "$RUNNER_TEMP/infra-dispatch.json"

          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${INFRA_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Content-Type: application/json" \
            --data-binary "@$RUNNER_TEMP/infra-dispatch.json" \
            "https://api.github.com/repos/${INFRA_REPOSITORY}/dispatches"

      - name: Write candidate summary
        shell: bash
        env:
          WEB_IMAGE: ${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/web
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
          PLATFORM_IMAGE: ${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/platform
          PLATFORM_DIGEST: ${{ steps.platform.outputs.digest }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          {
            echo "## Frontend candidates"
            echo
            echo "- Source SHA: \`${SOURCE_SHA}\`"
            echo "- Tag: \`sha-${SOURCE_SHA}\`"
            echo "- Web: \`${WEB_IMAGE}@${WEB_DIGEST}\`"
            echo "- Platform: \`${PLATFORM_IMAGE}@${PLATFORM_DIGEST}\`"
            echo "- Infrastructure promotion dispatched"
          } >> "$GITHUB_STEP_SUMMARY"
