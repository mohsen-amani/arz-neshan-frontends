name: CI

on:
  pull_request:
  merge_group:
  workflow_call:
    inputs:
      ref:
        description: Git ref to verify when called by another workflow
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: frontends-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}

jobs:
  verify:
    name: Verify frontend workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.1
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install locked dependencies
        run: yarn install --immutable

      - name: Check formatting
        run: yarn format:check

      - name: Test all frontend applications
        run: yarn test

      - name: Build all frontend applications
        run: yarn build

  containers:
    name: Build ${{ matrix.image }} image
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: web
            dockerfile: deploy/web/Dockerfile
            build_args: TURNSTILE_SITE_KEY=1x00000000000000000000AA
          - image: platform
            dockerfile: deploy/platform/Dockerfile
            build_args: ""

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build production image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build_args }}
          platforms: linux/amd64
          push: false
          tags: arz-neshan-${{ matrix.image }}:ci
          cache-from: type=gha,scope=frontends-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=frontends-${{ matrix.image }}
          provenance: false
          sbom: false
